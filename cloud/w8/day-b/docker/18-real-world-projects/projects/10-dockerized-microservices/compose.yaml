services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
  api:
    build: ./api
    environment:
      REDIS_URL: redis://redis:6379
  worker:
    build: ./worker
    environment:
      REDIS_URL: redis://redis:6379
  redis:
    image: redis:7-alpine
