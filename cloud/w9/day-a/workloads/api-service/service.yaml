apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: platform
  labels:
    app.kubernetes.io/name: api-service
    app.kubernetes.io/part-of: platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-service
  ports:
    - name: http
      port: 80
      targetPort: http
