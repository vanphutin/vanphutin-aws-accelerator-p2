apiVersion: v1
kind: Service
metadata:
  name: {{ include "api-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "api-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "api-service.name" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
