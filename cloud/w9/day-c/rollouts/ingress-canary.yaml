apiVersion: v1
kind: Service
metadata:
  name: api-service-canary
  namespace: platform
  labels:
    app.kubernetes.io/name: api-service
    traffic-role: canary
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-service
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-service-canary
  namespace: platform
  annotations:
    # Bật chế độ canary của NGINX cho ingress này.
    nginx.ingress.kubernetes.io/canary: "true"
    # Giá trị ban đầu là 0; Argo Rollouts controller sẽ cập nhật theo setWeight.
    nginx.ingress.kubernetes.io/canary-weight: "0"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: api.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-service-canary
                port:
                  number: 80
